name: espn-backfill

on:
  schedule:
    - cron: "30 9 * * *"     # nightly, 01:30 Pacific
  workflow_dispatch:
    inputs:
      league:
        description: "ESPN league slug (leave empty to use config/espn_targets.yml)"
        required: false
      from:
        description: "Start date YYYY-MM-DD"
        required: false
      to:
        description: "End date YYYY-MM-DD"
        required: false
      retry_bad:
        description: "Re-download matches that did not reconcile (true/false)"
        required: false
        default: "false"

concurrency: espn-backfill

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt boto3 && pip install -e .
      - name: Download matches, keep parsed shots only (resumes automatically)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          PITCHLINE_ROOT: s3://${{ vars.S3_BUCKET }}/pitchline
          IN_LEAGUE: ${{ github.event.inputs.league }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
          IN_RETRY: ${{ github.event.inputs.retry_bad }}
        run: |
          FLAG=""; [ "$IN_RETRY" = "true" ] && FLAG="--retry-bad"
          if [ -n "$IN_LEAGUE" ]; then
            python -m pitchline.espn_backfill --league "$IN_LEAGUE" --from "$IN_FROM" --to "$IN_TO" --max-minutes 300 $FLAG
          else
            python -m pitchline.espn_backfill --targets config/espn_targets.yml --max-minutes 300 $FLAG
          fi
